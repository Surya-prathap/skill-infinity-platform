# Skill Infinity - RabbitMQ configuration
# ---------------------------------------------------------------
# Microservices connect to RabbitMQ over the Docker bridge network.
# By default RabbitMQ restricts the "guest" user to loopback-only
# connections, which would make every service's AMQP health check
# report DOWN. For this development environment we lift that
# restriction so guest/guest works from any container.
# ---------------------------------------------------------------
loopback_users = none
