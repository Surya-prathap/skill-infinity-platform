      - skill-infinity-network

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: skill-infinity-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - skill-infinity-network
