version: '3.8'

networks:
  skill-infinity-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local

services:
  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: skill-infinity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill-infinity-network

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: skill-infinity-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill-infinity-network

  # ============================================================
  # RabbitMQ Message Broker
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skill-infinity-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check-port-connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - skill-infinity-network

  # ============================================================
  # MinIO Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: skill-infinity-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - skill-infinity-network

  # ============================================================
  # Config Server
  # ============================================================
  config-server:
    build:
      context: ../backend
      dockerfile: config-server/Dockerfile
    container_name: skill-infinity-config-server
    restart: unless-stopped
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      - CONFIG_SERVER_PORT=8888
      - CONFIG_REPO_URI=${CONFIG_REPO_URI:-}
      - CONFIG_REPO_DEFAULT_BRANCH=main
      - SPRING_PROFILES_ACTIVE=native
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Discovery Server
  # ============================================================
  discovery-server:
    build:
      context: ../backend
      dockerfile: discovery-server/Dockerfile
    container_name: skill-infinity-discovery-server
    restart: unless-stopped
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - DISCOVERY_SERVER_PORT=8761
      - EUREKA_HOSTNAME=discovery-server
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: skill-infinity-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - API_GATEWAY_PORT=8080
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Identity Service
  # ============================================================
  identity-service:
    build:
      context: ../backend
      dockerfile: identity-service/Dockerfile
    container_name: skill-infinity-identity-service
    restart: unless-stopped
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - IDENTITY_SERVICE_PORT=8081
      - IDENTITY_DB_HOST=mysql
      - IDENTITY_DB_NAME=skill_infinity_identity
      - IDENTITY_DB_USERNAME=root
      - IDENTITY_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - JWT_SECRET=${JWT_SECRET:?err}
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # User Service
  # ============================================================
  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    container_name: skill-infinity-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - USER_SERVICE_PORT=8082
      - USER_DB_HOST=mysql
      - USER_DB_NAME=skill_infinity_user
      - USER_DB_USERNAME=root
      - USER_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Mentor Service
  # ============================================================
  mentor-service:
    build:
      context: ../backend
      dockerfile: mentor-service/Dockerfile
    container_name: skill-infinity-mentor-service
    restart: unless-stopped
    ports:
      - "${MENTOR_SERVICE_PORT:-8083}:8083"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - MENTOR_SERVICE_PORT=8083
      - MENTOR_DB_HOST=mysql
      - MENTOR_DB_NAME=skill_infinity_mentor
      - MENTOR_DB_USERNAME=root
      - MENTOR_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Session Service
  # ============================================================
  session-service:
    build:
      context: ../backend
      dockerfile: session-service/Dockerfile
    container_name: skill-infinity-session-service
    restart: unless-stopped
    ports:
      - "${SESSION_SERVICE_PORT:-8084}:8084"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - SESSION_SERVICE_PORT=8084
      - SESSION_DB_HOST=mysql
      - SESSION_DB_NAME=skill_infinity_session
      - SESSION_DB_USERNAME=root
      - SESSION_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Wallet Service
  # ============================================================
  wallet-service:
    build:
      context: ../backend
      dockerfile: wallet-service/Dockerfile
    container_name: skill-infinity-wallet-service
