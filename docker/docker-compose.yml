    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Kolkata -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=10
      - WALLET_SERVICE_PORT=8085
      - WALLET_DB_HOST=mysql
      - WALLET_DB_NAME=skill_infinity_wallet
      - WALLET_DB_USERNAME=root
      - WALLET_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
