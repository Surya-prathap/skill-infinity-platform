    build:
      context: ../backend
      dockerfile: admin-service/Dockerfile
    container_name: skill-infinity-admin-service
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    ports:
      - "${ADMIN_SERVICE_PORT:-8090}:8090"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=50.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=10
      - ADMIN_SERVICE_PORT=8090
      - ADMIN_DB_HOST=mysql
      - ADMIN_DB_NAME=skill_infinity_admin
      - ADMIN_DB_USERNAME=root
      - ADMIN_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/readiness"]
      interval: 20s
      timeout: 20s
      retries: 30
      start_period: 600s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: skill-infinity-frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skill-infinity-network
