      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Kolkata -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=10
      - PAYMENT_SERVICE_PORT=8086
      - PAYMENT_DB_HOST=mysql
      - PAYMENT_DB_NAME=skill_infinity_payment
      - PAYMENT_DB_USERNAME=root
      - PAYMENT_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      # Razorpay TEST MODE — secrets stay server-side only (docker/.env,
      # gitignored). The frontend only ever receives the Key ID.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    healthcheck:
