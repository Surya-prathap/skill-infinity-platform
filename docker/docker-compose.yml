      start_period: 300s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skill-infinity-network

  # ============================================================
  # Session Service
  # ============================================================
  session-service:
    build:
      context: ../backend
      dockerfile: session-service/Dockerfile
    container_name: skill-infinity-session-service
    restart: unless-stopped
    mem_limit: 416m
    cpus: 0.5
    ports:
      - "${SESSION_SERVICE_PORT:-8084}:8084"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Kolkata -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=10
      - SESSION_SERVICE_PORT=8084
      - SESSION_DB_HOST=mysql
      - SESSION_DB_NAME=skill_infinity_session
      - SESSION_DB_USERNAME=root
      - SESSION_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - EUREKA_DEFAULT_ZONE=http://discovery-server:8761/eureka/
      # Free/community sessions per learner per month + real Discord invite.
      # DISCORD_MEETING_URL: the full URL of a REAL Discord server invite
      # (https://discord.gg/<code>). Blank (default) stores no meeting link —
      # the UI shows "Meeting link is not available yet." instead of ever
      # fabricating a discord.gg URL.
      - COMMUNITY_ALLOWANCE_PER_MONTH=${COMMUNITY_ALLOWANCE_PER_MONTH:-5}
      - DISCORD_MEETING_URL=${DISCORD_MEETING_URL:-}
      - DISCORD_INVITE_CODE=${DISCORD_INVITE_CODE:-}
      - JOIN_WINDOW_MINUTES=${JOIN_WINDOW_MINUTES:-10}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 300s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # STARTUP WAVE 2: wait for wave 1 (mentor) so only a few JVMs cold-start
      # at once on the 4-CPU/4.8GB Docker VM (avoids CPU starvation + OOM).
      mentor-service:
        condition: service_healthy
    networks:
      - skill-infinity-network

