    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - COMMUNITY_SERVICE_PORT=8088
      - COMMUNITY_DB_HOST=mysql
      - COMMUNITY_DB_NAME=skill_infinity_community
      - COMMUNITY_DB_USERNAME=root
      - COMMUNITY_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
