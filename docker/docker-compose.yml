      - PAYMENT_SERVICE_PORT=8086
      - PAYMENT_DB_HOST=mysql
      - PAYMENT_DB_NAME=skill_infinity_payment
      - PAYMENT_DB_USERNAME=root
      - PAYMENT_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?err}
