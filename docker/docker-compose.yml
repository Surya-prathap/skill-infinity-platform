  # ============================================================
  # Frontend
  # ------------------------------------------------------------
  # The frontend intentionally runs OUTSIDE Docker (npm run dev on the
  # host) so its Vite dev server does not compete with the backend JVMs
  # for the constrained 4-CPU/4.8GB Docker VM. The Vite proxy forwards
  # /api to the gateway on localhost:8080, and the gateway CORS allow-list
  # includes http://localhost:3000.
  # ============================================================
