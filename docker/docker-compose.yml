# ============================================================
# Skill Infinity Platform — Docker Compose
# ------------------------------------------------------------
# Tuned for Docker Desktop / constrained hosts (4 CPUs, ~4.8 GB).
# Every limit below is a CEILING, and the JVMs are configured with
# G1GC + a compact heap (MaxRAMPercentage=50) so the combined working
# set stays well below the host memory. Health checks use
# /actuator/health/readiness with generous start periods because
# 11 JVMs share 4 CPUs during a cold start.
# ============================================================

networks:
  skill-infinity-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local

services:
  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: skill-infinity-mysql
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs init-db.sql (creates 10 databases); give it time
      start_period: 90s
    networks:
      - skill-infinity-network

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: skill-infinity-redis
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skill-infinity-network

  # ============================================================
  # RabbitMQ Message Broker
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skill-infinity-rabbitmq
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Allow guest/guest connections from non-loopback (Docker network) interfaces
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      # -q ping is much lighter than check_port_connectivity; the heavier probe
      # times out under memory pressure while the 11 JVMs cold-start on 4 CPUs.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 20s
      retries: 15
      start_period: 120s
    networks:
      - skill-infinity-network

  # ============================================================
  # MinIO Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: skill-infinity-minio
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - skill-infinity-network

  # ============================================================
  # Config Server
  # ============================================================
  config-server:
    build:
      context: ../backend
      dockerfile: config-server/Dockerfile
    container_name: skill-infinity-config-server
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=50.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=10
      - CONFIG_SERVER_PORT=8888
      - CONFIG_REPO_URI=${CONFIG_REPO_URI:-}
      - CONFIG_REPO_DEFAULT_BRANCH=main
      - SPRING_PROFILES_ACTIVE=native
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health/readiness"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 600s
    networks:
      - skill-infinity-network

  # ============================================================
  # Discovery Server
  # ============================================================
  discovery-server:
