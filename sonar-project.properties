# SonarQube Project Configuration
sonar.projectKey=skill-infinity-platform
sonar.projectName=Skill Infinity Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend/common/src/main/java,backend/config-server/src/main/java,backend/discovery-server/src/main/java,backend/api-gateway/src/main/java,backend/identity-service/src/main/java,backend/user-service/src/main/java,backend/mentor-service/src/main/java,backend/session-service/src/main/java,backend/wallet-service/src/main/java,backend/payment-service/src/main/java,backend/admin-service/src/main/java

# Test directories
sonar.tests=backend/common/src/test/java,backend/identity-service/src/test/java,backend/user-service/src/test/java,backend/mentor-service/src/test/java,backend/session-service/src/test/java,backend/wallet-service/src/test/java,backend/payment-service/src/test/java,backend/admin-service/src/test/java

# Java binary directories
sonar.java.binaries=**/target/classes

# JaCoCo coverage reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/target/**
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/exception/**,**/enumeration/**,**/event/**,**/mapper/**,**/*Application.java

# Language
sonar.language=java

# Source encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=21

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
