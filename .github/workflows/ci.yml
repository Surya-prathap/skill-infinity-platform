name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main
  pull_request:
    branches:
      - dev
      - stage
      - main

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # Backend Build & Test
  # ============================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile Backend
        run: |
          cd backend
          mvn clean compile -q

      - name: Run Unit Tests
        run: |
          cd backend
          mvn test -q

      - name: Generate JaCoCo Coverage Report
        run: |
          cd backend
          mvn jacoco:report -q

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/**/target/surefire-reports/

  # ============================================================
  # Code Quality & Static Analysis
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle Analysis
        run: |
          cd backend
          mvn checkstyle:check -q || true

      - name: PMD Analysis
        run: |
          cd backend
          mvn pmd:check -q || true

      - name: SpotBugs Analysis
        run: |
          cd backend
          mvn spotbugs:check -q || true

      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'skill-infinity-platform'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # ============================================================
  # Frontend Build
  # ============================================================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ============================================================
  # Docker Build
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - identity-service
          - user-service
          - mentor-service
          - session-service
          - wallet-service
          - payment-service
          - admin-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skill-infinity-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skill-infinity-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Docker Compose Integration Test
  # ============================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    env:
      MYSQL_ROOT_PASSWORD: testpassword
      JWT_SECRET: test-jwt-secret-key-for-integration-testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          sed -i '/^MYSQL_ROOT_PASSWORD=/d' .env
          sed -i '/^JWT_SECRET=/d' .env
          echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env

      - name: Start services with Docker Compose
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml up -d
          sleep 60

      - name: Check health endpoints
        run: |
          check_health() {
            SERVICE_NAME=$1
            URL=$2
          
            echo "Checking $SERVICE_NAME..."
          
            for i in $(seq 1 30); do
              if curl -sf "$URL" > /dev/null; then
                echo "$SERVICE_NAME is healthy"
                return 0
              fi
          
              echo "$SERVICE_NAME is not ready yet... attempt $i/30"
              sleep 5
            done
          
            echo "$SERVICE_NAME failed health check"
            docker compose --env-file .env -f docker/docker-compose.yml ps
            return 1
          }
          
          check_health "Config Server" "http://localhost:8888/actuator/health"
          check_health "Discovery Server" "http://localhost:8761/actuator/health"
          check_health "API Gateway" "http://localhost:8080/actuator/health"

      - name: Run API smoke tests
        run: |
          curl -sf http://localhost:8888/actuator/health
          curl -sf http://localhost:8761/actuator/health
          curl -sf http://localhost:8080/actuator/health

      - name: Show Docker Compose status
        if: always()
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml ps

      - name: Stop services
        if: always()
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml down

  # ============================================================
  # Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install backend modules
        run: |
          cd backend
          mvn -B clean install -DskipTests

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ============================================================
  # SonarQube Analysis
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=skill-infinity-platform
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.java.libraries=**/target/dependency/*
        continue-on-error: true
