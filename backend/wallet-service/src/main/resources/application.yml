server:
  port: ${WALLET_SERVICE_PORT:8085}

spring:
  application:
    name: wallet-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${WALLET_DB_HOST:localhost}:${WALLET_DB_PORT:3306}/${WALLET_DB_NAME:skill_infinity_wallet}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${WALLET_DB_USERNAME:root}
    password: ${WALLET_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    template:
      exchange: wallet.exchange
    listener:
      direct:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Skill Infinity Wallet Service
    version: @project.version@

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${WALLET_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

wallet:
  cache:
    balance-ttl: 300
    statement-ttl: 600
    statistics-ttl: 300
  credit:
    default-currency: CREDITS
    min-purchase-amount: 10
    max-purchase-amount: 10000
    expiration-days: 365
  transaction:
    id-prefix: "TXN"
    id-length: 12

app:
  withdrawal:
    credit-value-inr: 10
    platform-fee-percent: 10.0
    min-credits: 10
  earning:
    learning-credit-percent: 50.0
