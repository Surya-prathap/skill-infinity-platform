server:
  port: 8088

spring:
  application:
    name: communication-service
  datasource:
    url: jdbc:mysql://${COMMUNICATION_DB_HOST:localhost}:${COMMUNICATION_DB_PORT:3306}/${COMMUNICATION_DB_NAME:skill_infinity_communication}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${COMMUNICATION_DB_USERNAME:root}
    password: ${COMMUNICATION_DB_PASSWORD:Surya@2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /communication-service/v3/api-docs
  swagger-ui:
    path: /communication-service/swagger-ui.html

logging:
  level:
    com.skillinfinity: INFO
