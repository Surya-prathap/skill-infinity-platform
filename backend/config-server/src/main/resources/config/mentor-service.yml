server:
  port: 8083

spring:
  application:
    name: mentor-service
  datasource:
    url: jdbc:mysql://${MENTOR_DB_HOST:localhost}:${MENTOR_DB_PORT:3306}/${MENTOR_DB_NAME:skill_infinity_mentor}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MENTOR_DB_USERNAME:root}
    password: ${MENTOR_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    template:
      exchange: mentor.exchange
    listener:
      direct:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Skill Infinity Mentor Service

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${MENTOR_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

springdoc:
  api-docs:
    path: /mentor-service/v3/api-docs
  swagger-ui:
    path: /mentor-service/swagger-ui.html
    enabled: true

mentor:
  cache:
    profile-ttl: 600
    search-ttl: 300
    category-ttl: 1800
  file:
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
