server:
  port: 8087

spring:
  application:
    name: community-service
  datasource:
    url: jdbc:mysql://${COMMUNITY_DB_HOST:localhost}:${COMMUNITY_DB_PORT:3306}/${COMMUNITY_DB_NAME:skill_infinity_community}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${COMMUNITY_DB_USERNAME:root}
    password: ${COMMUNITY_DB_PASSWORD:Surya@2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /community-service/v3/api-docs
  swagger-ui:
    path: /community-service/swagger-ui.html

logging:
  level:
    com.skillinfinity: INFO
