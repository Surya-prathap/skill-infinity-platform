server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    description: Skill Infinity Config Server - Centralized Configuration Management
    java-version: @java.version@

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.cloud.config: INFO
    org.springframework.boot.actuate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${CONFIG_SERVER_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

---
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI}
          default-label: ${CONFIG_REPO_DEFAULT_BRANCH:main}
          clone-on-start: ${CONFIG_REPO_CLONE_ON_START:true}
          force-pull: ${CONFIG_REPO_FORCE_PULL:true}
          timeout: ${CONFIG_REPO_TIMEOUT:10}
          basedir: ${CONFIG_REPO_BASEDIR:${java.io.tmpdir}/config-repo}
          search-paths: '{application}'
          username: ${CONFIG_REPO_USERNAME:}
          password: ${CONFIG_REPO_PASSWORD:}
        bootstrap: true
