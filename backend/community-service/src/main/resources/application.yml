server:
  port: ${COMMUNITY_SERVICE_PORT:8088}

spring:
  application:
    name: community-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${COMMUNITY_DB_HOST:localhost}:${COMMUNITY_DB_PORT:3306}/${COMMUNITY_DB_NAME:skill_infinity_community}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${COMMUNITY_DB_USERNAME:root}
    password: ${COMMUNITY_DB_PASSWORD:Surya@2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    template:
      exchange: community.exchange
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  servlet:
    multipart:
      max-file-size: ${COMMUNITY_MAX_FILE_SIZE:10MB}
      max-request-size: ${COMMUNITY_MAX_REQUEST_SIZE:20MB}

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Skill Infinity Community Service

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${COMMUNITY_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

community:
  cache:
    trending-ttl: 300
    popular-ttl: 120
    tag-ttl: 300
    top-contributors-ttl: 600
  post:
    max-content-length: 50000
    max-title-length: 200
    trending-window-days: 7
  comment:
    max-content-length: 10000
  poll:
    max-options: 10
    min-options: 2
    max-duration-days: 30
  search:
    max-results: 50
