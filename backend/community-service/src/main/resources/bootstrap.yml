spring:
  application:
    name: community-service
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 5
        multiplier: 1.5
      enabled: true

---
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      enabled: false
