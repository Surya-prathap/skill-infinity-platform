server:
  port: ${SESSION_SERVICE_PORT:8084}

spring:
  application:
    name: session-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${SESSION_DB_HOST:localhost}:${SESSION_DB_PORT:3306}/${SESSION_DB_NAME:skill_infinity_session}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SESSION_DB_USERNAME:root}
    password: ${SESSION_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    template:
      exchange: session.exchange
    listener:
      direct:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

app:
  services:
    # Resolved by Docker DNS on the shared compose network; override for local runs.
    wallet-service-url: ${WALLET_SERVICE_URL:http://wallet-service:8085}

community:
  allowance:
    per-month: 3
  recognition:
    thresholds: 5,15,30,50
    labels: Community Mentor,Active Contributor,Community Champion,Community Leader

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Skill Infinity Session Service
    version: "1.0.0-SNAPSHOT"

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${SESSION_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

session:
  cache:
    upcoming-ttl: 300
    session-detail-ttl: 600
    mentor-schedule-ttl: 300
  booking:
    expiration-minutes: 30
    max-sessions-per-day: 5
  reminder:
    24-hour-enabled: true
    1-hour-enabled: true
    15-min-enabled: true
