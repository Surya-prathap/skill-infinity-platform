server:
  port: ${COMMUNICATION_SERVICE_PORT:8087}

spring:
  application:
    name: communication-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${COMMUNICATION_DB_HOST:localhost}:${COMMUNICATION_DB_PORT:3306}/${COMMUNICATION_DB_NAME:skill_infinity_communication}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${COMMUNICATION_DB_USERNAME:root}
    password: ${COMMUNICATION_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    template:
      exchange: communication.exchange
    listener:
      simple:
        auto-startup: false

      direct:
        auto-startup: false

        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
  servlet:
    multipart:
      max-file-size: ${COMMUNICATION_MAX_FILE_SIZE:10MB}
      max-request-size: ${COMMUNICATION_MAX_REQUEST_SIZE:20MB}

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Skill Infinity Communication Service

logging:
  level:
    com.skillinfinity: INFO
    org.springframework.amqp: INFO
    org.springframework.web.socket: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %msg%n"
  file:
    name: ${COMMUNICATION_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

communication:
  cache:
    conversations-ttl: 300
    unread-count-ttl: 60
    notification-count-ttl: 60
    online-users-ttl: 30
  chat:
    message-max-length: 5000
    history-page-size: 50
    typing-timeout-seconds: 30
  file:
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,image/webp,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_COMMUNICATION_BUCKET:communication-files}
  notification:
    batch-size: 50
    push-enabled: false
    sms-enabled: false
  email:
    from-address: ${MAIL_FROM_ADDRESS:noreply@skillinfinity.com}
    from-name: ${MAIL_FROM_NAME:Skill Infinity}
    templates:
      welcome: email/welcome
      password-reset: email/password-reset
      email-verification: email/email-verification
      booking-confirmation: email/booking-confirmation
      session-reminder: email/session-reminder
      payment-receipt: email/payment-receipt
      refund-notification: email/refund-notification
      subscription-notification: email/subscription-notification
      announcement: email/announcement
